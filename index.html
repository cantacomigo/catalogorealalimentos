    <script>
      // Prevent extensions and interceptors from throwing TypeError when assigning to window.fetch
      try {
        var _fetch = window.fetch;
        Object.defineProperty(window, 'fetch', {
          get: function() { return _fetch; },
          set: function(v) { _fetch = v; },
          configurable: true,
          enumerable: true
        });
      } catch (e) {}
    </script>
